#!ifdef WITH_N5
# Keep the initial From/To roles for both directions of the dialog.
route[N5_MEDIA_KEY] {
	if (strempty($ci) || strempty($ft) || strempty($tt)) {
		return(-1);
	}

	$var(n5_upstream) = 0;
	# TM copies the request's message flags into its onreply_route.
	if (isflagset(FLT_N5_UPSTREAM)) {
		$var(n5_upstream) = 1;
	}

	$var(n5_from_tag) = $ft;
	$var(n5_to_tag) = $tt;
	if ($var(n5_upstream) == 1) {
		$var(n5_from_tag) = $tt;
		$var(n5_to_tag) = $ft;
	}
	$var(n5_key) = $var(n5_leg) + "|" + $ci + "|" + $var(n5_from_tag) + "|" + $var(n5_to_tag);
	return(1);
}

route[N5_MEDIA_HEADERS] {
	$var(n5_headers) = "3gpp-sbi-discovery-target-nf-type: PCF\r\n"
		+ "accept: application/json, application/problem+json\r\n"
		+ "3gpp-sbi-max-rsp-time: 10000\r\n"
		+ "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n"
		+ "3gpp-sbi-sender-timestamp: " + $_s($timef(%a, %d %b %Y %H:%M:%S %Z));
}

# The hash slot lock serializes PCF operations for this dialog leg.
route[N5_MEDIA_AUTHORIZE] {
	if (!sht_lock("n5_media_dialogs=>$var(n5_key)")) {
		return;
	}
	$var(n5_app_session) = "";
	if ($sht(n5_media_dialogs=>$var(n5_key)) != $null) {
		$var(n5_app_session) = $sht(n5_media_dialogs=>$var(n5_key));
	}
	if ($var(n5_app_session) =~ "^closed(:|$)") {
		sht_unlock("n5_media_dialogs=>$var(n5_key)");
		return;
	}

	route(N5_MEDIA_HEADERS);
	$var(n5_authorized) = 0;
	if ($var(n5_app_session) != "") {
		# Update negotiated media without changing the subscriber identity.
		$var(n5_body) = '{"ascReqData":{"medComponents":{' + $var(media_components_body) + '}}}';
		$var(n5_headers) = "Content-Type: application/merge-patch+json\r\n" + $var(n5_headers);
		http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(n5_app_session)", "$var(n5_body)", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) == 200 || $var(n5_http_status) == 204) {
			$sht(n5_media_dialogs=>$var(n5_key)) = $var(n5_app_session);
			$var(n5_authorized) = 1;
			xlog("L_INFO", "N5 media PATCH dialog=$var(n5_key) appSession=$var(n5_app_session)\n");
		}
	} else {
		$var(n5_headers) = "Content-Type: application/json\r\n" + $var(n5_headers);
		http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(ue_policy_authorization_body)", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) == 201 && !strempty($httprhdr(location))) {
			$var(n5_location) = $httprhdr(location);
			$var(n5_app_session) = $(var(n5_location){s.trim}{s.select,-1,/});
			if ($var(n5_app_session) =~ "^[A-Za-z0-9._~-]+$") {
				$sht(n5_media_dialogs=>$var(n5_key)) = $var(n5_app_session);
				$var(n5_authorized) = 1;
				xlog("L_INFO", "N5 media POST dialog=$var(n5_key) appSession=$var(n5_app_session) ue=$var(ue_ip)\n");
			}
		}
	}
	sht_unlock("n5_media_dialogs=>$var(n5_key)");

	if ($var(n5_authorized) == 0) {
		xlog("L_ERR", "N5 media authorization failed dialog=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status)\n");
		if ($var(n5_initial) == 1) {
			route(N5_MEDIA_END);
			if (dlg_get("$ci", "$var(n5_from_tag)", "$var(n5_to_tag)")) {
				dlg_terminate("all", "N5 QoS authorization failed for call");
			} else {
				send_reply("412", "N5 QoS authorization failed for call");
			}
			exit;
		}
	}
}

route[N5_MEDIA_END] {
	if (!route(N5_MEDIA_KEY)) {
		return;
	}
	if (!sht_lock("n5_media_dialogs=>$var(n5_key)")) {
		return;
	}
	$var(n5_app_session) = "";
	if ($sht(n5_media_dialogs=>$var(n5_key)) != $null) {
		$var(n5_app_session) = $sht(n5_media_dialogs=>$var(n5_key));
	}
	if ($var(n5_app_session) == "closed") {
		sht_unlock("n5_media_dialogs=>$var(n5_key)");
		return;
	}
	if ($var(n5_app_session) =~ "^closed:") {
		$var(n5_app_session) = $(var(n5_app_session){s.select,1,:});
	}

	$var(n5_closed) = 1;
	if ($var(n5_app_session) != "") {
		route(N5_MEDIA_HEADERS);
		$var(n5_headers) = "X-SIP-Status: Call-End-MT\r\n" + $var(n5_headers);
		http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(n5_app_session)/delete", "", "$var(n5_headers)", "$var(n5_result)");
		$var(n5_http_status) = $rc;
		if ($var(n5_http_status) != 204 && $var(n5_http_status) != 404) {
			$var(n5_closed) = 0;
			xlog("L_ERR", "N5 media delete failed dialog=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status)\n");
		} else {
			xlog("L_INFO", "N5 media DELETE dialog=$var(n5_key) appSession=$var(n5_app_session) status=$var(n5_http_status)\n");
		}
	}
	if ($var(n5_closed) == 1) {
		# A late media reply must not reopen a terminated dialog.
		$sht(n5_media_dialogs=>$var(n5_key)) = "closed";
		$shtex(n5_media_dialogs=>$var(n5_key)) = 180;
	} else {
		# Retain the exact ID for a retry on the BYE reply or retransmission.
		$sht(n5_media_dialogs=>$var(n5_key)) = "closed:" + $var(n5_app_session);
	}
	sht_unlock("n5_media_dialogs=>$var(n5_key)");
}
#!endif
